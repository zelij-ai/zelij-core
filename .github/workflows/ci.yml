# Intégration continue : ce qui doit être vrai avant toute fusion et toute version.
# Tests (base SQLite, aucun réseau), lint, audit des dépendances, scan du code, contrôle de publication.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:        # appelé par release.yml avant toute publication

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyflakes pip-audit bandit
      - name: Tests
        run: python -m pytest -q
      - name: Lint
        run: pyflakes core scripts tests
      - name: Dépendances sans avis de sécurité
        run: pip-audit -r requirements.txt
      - name: Scan du code
        run: bandit -q -r core scripts -ll
      - name: Rien d'interne dans le dépôt
        run: python scripts/controle_publication.py

  image:
    # L'image se construit à chaque fois ; elle n'est publiée qu'avec une version (voir release.yml).
    runs-on: ubuntu-latest
    needs: verifier
    steps:
      - uses: actions/checkout@v4
      - name: Construction de l'image
        run: docker build -t zelij-core:ci .
      - name: Démarrage à blanc
        run: |
          docker run -d --name core -e CORE_ENV=production -e SECRET_KEY=ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci \
            -e DATABASE_URL=sqlite:////tmp/ci.sqlite -p 8000:8000 zelij-core:ci
          for i in $(seq 1 30); do curl -fs http://localhost:8000/healthz && exit 0; sleep 2; done
          docker logs core; exit 1
