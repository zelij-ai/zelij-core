<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>{% block titre %}Bureau{% endblock %} — Zelij Core</title>
<link rel="stylesheet" href="/static/app.css?v={{ VERSION }}">
</head>
<body>
<a class="evitement" href="#contenu">Aller au contenu</a>
<header class="entete">
  <a class="marque" href="/bureau" aria-label="Zelij Core, bureau">
    <span class="marque-carreau" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2l2.6 6.4L21 12l-6.4 3.6L12 22l-2.6-6.4L3 12l6.4-3.6z" fill="#fff" opacity=".95"/><circle cx="12" cy="12" r="2.2" fill="#1c1917"/></svg></span>
    Zelij Core
  </a>
  {% if u %}
  <nav class="nav" aria-label="Sections">
    <a href="/bureau" {% if request.url.path.startswith('/bureau') %}aria-current="page"{% endif %}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 20v-6"/></svg>Bureau</a>
    <a href="/finances" {% if request.url.path.startswith('/finances') %}aria-current="page"{% endif %}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 19h16M6 16V9m6 7V5m6 11v-4"/></svg>Finances</a>
    <a href="/aquarium" {% if request.url.path.startswith('/aquarium') %}aria-current="page"{% endif %}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12c3-5 8-7 12-5l6 5-6 5c-4 2-9 0-12-5z"/><circle cx="12" cy="12" r="1"/></svg>Aquarium</a>
    <a href="/catalogue" {% if request.url.path.startswith('/catalogue') %}aria-current="page"{% endif %}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><path d="M17 14v6m-3-3h6"/></svg>Catalogue</a>
    <a href="/batir" {% if request.url.path.startswith('/batir') %}aria-current="page"{% endif %}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20h16M6 20V9l6-5 6 5v11M10 20v-5h4v5"/></svg>Factory</a>
    <a href="/contacts" {% if request.url.path.startswith('/contacts') %}aria-current="page"{% endif %}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4a3.5 3.5 0 0 1 0 7m5.5 9a6.5 6.5 0 0 0-5-6.3"/></svg>Contacts</a>
  </nav>
  <div class="compte"><img class="avatar" src="/portraits/fondateur?v={{ VERSION }}" alt="" width="32" height="32"><span class="compte-org" title="{{ u.email }}">{{ u.organisation }}</span>
    <form method="post" action="/deconnexion"><input type="hidden" name="_csrf" value="{{ csrf }}"><button class="lien" type="submit">Se déconnecter</button></form></div>
  {% endif %}
</header>
<main id="contenu" class="cadre">
  {% if message %}<p class="message" role="status"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>{{ message }}</p>{% endif %}
  {% block contenu %}{% endblock %}
</main>
<footer class="pied"><p>Zelij Core {{ VERSION }} · les agents proposent, vous décidez · <a href="https://zelij.ai/" rel="noopener">by zelij.ai</a></p></footer>
<script src="/static/bureau.js?v={{ VERSION }}" defer></script>
</body>
</html>
